<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compressor</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 16px; background: #000; color: #ddd;
    font: 15px/1.6 system-ui, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 4px 0; }
  button {
    font: inherit; color: #ddd; background: #222; border: 1px solid #555;
    border-radius: 4px; padding: 6px 20px; cursor: pointer;
  }
  button:hover { background: #333; }
  #connect { margin: 12px 0 20px; }

  /* fader: thumb width is used by the scale below */
  .fader { --thumb: 16px; position: relative; margin-bottom: 20px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; display: block;
    width: 100%; height: 24px; margin: 0; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #555; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: var(--thumb); height: 20px; margin-top: -8px;
    background: #ddd; border-radius: 3px;
  }
  input[type=range]::-moz-range-track { height: 4px; background: #555; border-radius: 2px; }
  input[type=range]::-moz-range-thumb { width: var(--thumb); height: 20px; background: #ddd; border: 0; border-radius: 3px; }
  .scale { position: relative; height: 28px; }
  .scale span {
    position: absolute; top: 0; transform: translateX(-50%);
    font-size: 12px; color: #999; white-space: nowrap;
  }
  .scale span::before {
    content: ""; display: block; width: 1px; height: 6px; margin: 0 auto 2px; background: #777;
  }

  canvas { display: block; width: 100%; height: 320px; background: #000; border: 1px solid #333; }
  #reset { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Compressor</h1>
  <p>YouTubeの音量を強制的に上げます。</p>
  <p>別タブで聴きたいYouTubeを開いてください</p>

  <button id="connect">接続</button>

  <div class="fader">
    <input id="fader" type="range" min="0" max="10" step="1" value="0">
    <div class="scale" id="scale"></div>
  </div>

  <canvas id="graph"></canvas>
  <button id="reset">グラフリセット</button>
</main>

<script id="worklet" type="text/plain">
const BINS = 1000;   // graph bins over 10 s
class Compressor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.makeup = 1;
    this.h = [0, 0];
    this.binSize = Math.max(1, Math.round(sampleRate * 10 / BINS));
    this.resetBin();
    this.port.onmessage = (e) => { this.makeup = e.data; };
  }
  resetBin() {
    this.n = 0;
    this.inMin = Infinity; this.inMax = -Infinity;
    this.outMin = Infinity; this.outMax = -Infinity;
  }
  process(inputs, outputs) {
    const input = inputs[0], output = outputs[0];
    if (!input.length) return true;
    const ratio = 0.8, decay = 0.9, makeup = this.makeup;
    const len = output[0].length;
    for (let c = 0; c < output.length; c++) {
      const x = input[c] || input[0], y = output[c];
      let h = this.h[c] || 0;
      for (let t = 0; t < len; t++) {
        // h(t) = max(|x(t)*makeup|, h(t-1)*decay)
        h = Math.max(Math.abs(x[t] * makeup), h * decay);
        // g(t) = h(t) <= 1 ? makeup : makeup * (1 + (h(t)-1)*ratio) / h(t)
        // so that the peak level becomes 1 + (h-1)*ratio and g is continuous at h = 1
        const g = h <= 1 ? makeup : makeup * (1 + (h - 1) * ratio) / h;
        // out(t) = x(t)*g(t)
        y[t] = x[t] * g;
      }
      this.h[c] = h;
    }
    for (let t = 0; t < len; t++) {
      for (let c = 0; c < output.length; c++) {
        const x = (input[c] || input[0])[t], y = output[c][t];
        if (x < this.inMin) this.inMin = x;
        if (x > this.inMax) this.inMax = x;
        if (y < this.outMin) this.outMin = y;
        if (y > this.outMax) this.outMax = y;
      }
      if (++this.n >= this.binSize) {
        this.port.postMessage([this.inMin, this.inMax, this.outMin, this.outMax]);
        this.resetBin();
      }
    }
    return true;
  }
}
registerProcessor('compressor', Compressor);
</script>

<script>
const BINS = 1000;
const fader = document.getElementById('fader');
const canvas = document.getElementById('graph');
const g2d = canvas.getContext('2d');

// fader scale: one tick per 1 dB
const scale = document.getElementById('scale');
for (let db = 0; db <= 10; db++) {
  const s = document.createElement('span');
  s.textContent = db === 0 ? '0 dB' : '+' + db;
  s.style.left = `calc(var(--thumb) / 2 + (100% - var(--thumb)) * ${db / 10})`;
  scale.appendChild(s);
}

// ---- audio ----
let ctx = null, node = null, source = null, stream = null;
const makeup = () => Math.pow(10, fader.value / 20);
fader.addEventListener('input', () => { if (node) node.port.postMessage(makeup()); });

function disconnect() {
  if (source) source.disconnect();
  if (stream) stream.getTracks().forEach((t) => t.stop());
  source = null; stream = null;
}

document.getElementById('connect').addEventListener('click', async () => {
  disconnect();
  try {
    if (!ctx) {
      ctx = new AudioContext();
      const code = document.getElementById('worklet').textContent;
      const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      await ctx.audioWorklet.addModule(url);
      node = new AudioWorkletNode(ctx, 'compressor', {
        channelCount: 2, channelCountMode: 'explicit', outputChannelCount: [2],
      });
      node.port.onmessage = (e) => push(e.data);
      node.connect(ctx.destination);
    }
    await ctx.resume();
    node.port.postMessage(makeup());
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: {
        suppressLocalAudioPlayback: true,
        echoCancellation: false, noiseSuppression: false, autoGainControl: false,
      },
      preferCurrentTab: false,
      selfBrowserSurface: 'exclude',
      systemAudio: 'exclude',
    });
    if (!stream.getAudioTracks().length) {
      disconnect();
      alert('音声が共有されていません。YouTubeのタブを選び、「タブの音声も共有する」をオンにしてください。');
      return;
    }
    stream.getAudioTracks()[0].addEventListener('ended', disconnect);
    source = ctx.createMediaStreamSource(stream);
    source.connect(node);
  } catch (e) {
    disconnect();
    if (e.name !== 'NotAllowedError') alert(e.message);
  }
});

// ---- graph ----
// ring buffer of [inMin, inMax, outMin, outMax] per bin
const ring = new Float32Array(BINS * 4);
let head = 0, count = 0;
function push(v) {
  ring.set(v, head * 4);
  head = (head + 1) % BINS;
  if (count < BINS) count++;
}
document.getElementById('reset').addEventListener('click', () => { head = 0; count = 0; });

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W = Math.round(canvas.clientWidth * dpr), H = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  g2d.fillStyle = '#000';
  g2d.fillRect(0, 0, W, H);

  // vertical axis: linear level [-2, +2]
  const y = (v) => H / 2 - Math.max(-2, Math.min(2, v)) * H / 4;
  const bw = W / BINS;
  // pre (blue) is drawn after post (red) so that it is in front
  for (const [lo, hi, color] of [[2, 3, '#f33'], [0, 1, '#39f']]) {
    g2d.fillStyle = color;
    for (let k = 0; k < count; k++) {
      const i = ((head - count + k) % BINS + BINS) % BINS;
      const x = W - (count - k) * bw;   // right end is the newest
      const top = y(ring[i * 4 + hi]), bottom = y(ring[i * 4 + lo]);
      g2d.fillRect(x, top, Math.max(1, bw), Math.max(1, bottom - top));
    }
  }

  g2d.fillStyle = '#0c0';
  g2d.fillRect(0, Math.round(y(1)), W, Math.max(1, Math.round(dpr)));
  g2d.fillRect(0, Math.round(y(-1)), W, Math.max(1, Math.round(dpr)));
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
